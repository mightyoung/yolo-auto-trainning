name: Auto-Train on Push

on:
  push:
    branches: [main, master]
    paths:
      - 'train/**'
      - 'data/**'

jobs:
  trigger-training:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Training API
        run: |
          curl -X POST http://${{ secrets.TRAINING_API_HOST }}/api/v1/train/start \
            -H "X-API-Key: ${{ secrets.TRAINING_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"task_id": "github-${{ github.run_id }}", "model": "yolo11m", "data_yaml": "data/dataset.yaml", "epochs": 50}'
